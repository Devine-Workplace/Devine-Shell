[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devine"
requires-python = ">=3.13"
version = "0.1.0"
dependencies = [
    "pillow",
    "materialyoucolor"
]

[project.scripts]
devine = "devine:main"

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "completions",
    "README.md"
]

[tool.ruff]
line-length = 120
